# Control automático del estándar de Augu.
# - Corre en este repo en cada push.
# - Los demás repos lo llaman con plantillas/.github/workflows/estandar-augu.yml
#   (requiere: Settings > Actions > General > Access > "Accessible from repositories owned by parraau").
name: Estándar Augu

on:
  push:
  pull_request:
  workflow_call:
    secrets:
      DEV_SETUP_TOKEN:
        required: false   # solo hace falta si dev-setup es privado

permissions:
  contents: read

jobs:
  revisar:
    name: Seguridad, dependencias, plataforma y diseño
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Código del proyecto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historial completo para que gitleaks revise commits viejos

      - name: Herramientas del estándar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: parraau/dev-setup
          path: .estandar-augu
          token: ${{ secrets.DEV_SETUP_TOKEN || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep, pip-audit y gitleaks
        run: bash .estandar-augu/herramientas/instalar-linux.sh

      - name: Revisar el proyecto
        run: |
          # la carpeta de herramientas no se revisa a sí misma cuando corre en otro repo
          [ "${{ github.repository }}" != "parraau/dev-setup" ] && echo ".estandar-augu/" >> .semgrepignore
          bash .estandar-augu/herramientas/revisar-proyecto.sh .
