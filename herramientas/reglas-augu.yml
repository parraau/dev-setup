# Reglas propias del estándar de Augu (complementan los paquetes de Semgrep).
# Cubren HTML con scripts embebidos, que los paquetes estándar no siempre revisan.
rules:
  - id: augu-innerhtml
    languages: [regex]
    paths: { include: ["*.html", "*.htm", "*.js", "*.mjs", "*.ts", "*.jsx", "*.tsx", "*.vue", "*.svelte"] }
    pattern-regex: '\.(innerHTML|outerHTML)\s*\+?=(?!=)'
    message: "innerHTML/outerHTML: usar textContent o crear nodos; si hace falta HTML, sanitizar con DOMPurify."
    severity: ERROR
  - id: augu-insert-html
    languages: [regex]
    paths: { include: ["*.html", "*.htm", "*.js", "*.mjs", "*.ts", "*.jsx", "*.tsx"] }
    pattern-regex: '(insertAdjacentHTML|document\.write(ln)?)\s*\('
    message: "insertAdjacentHTML / document.write: riesgo de XSS. Usar creación de nodos."
    severity: ERROR
  - id: augu-eval
    languages: [regex]
    paths: { include: ["*.html", "*.htm", "*.js", "*.mjs", "*.ts", "*.jsx", "*.tsx"] }
    pattern-regex: '(?<![\w.])(eval|new\s+Function)\s*\(|set(Timeout|Interval)\(\s*["''`]'
    message: "eval / new Function / timer con string: prohibido por el estándar (rompe la CSP)."
    severity: ERROR
  - id: augu-handler-inline
    languages: [regex]
    paths: { include: ["*.html", "*.htm"] }
    pattern-regex: '<[a-zA-Z][^>]*\son(click|load|error|submit|change|input|mouse\w+|key\w+|focus|blur)\s*='
    message: "Handler inline (onclick=...): mover a addEventListener; rompe la CSP sin 'unsafe-inline'."
    severity: ERROR
  - id: augu-target-blank
    languages: [regex]
    paths: { include: ["*.html", "*.htm", "*.jsx", "*.tsx", "*.vue"] }
    pattern-regex: '<a\b(?=[^>]*target=["'']_blank)(?![^>]*rel=["''][^"'']*noopener)[^>]*>'
    message: "Link con target=_blank sin rel=\"noopener noreferrer\"."
    severity: WARNING
